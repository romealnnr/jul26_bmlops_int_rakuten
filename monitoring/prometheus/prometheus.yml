# Prometheus scrape configuration.
#
# Every component of the stack is scraped, not only the API, so that a dead
# Airflow scheduler, an unreachable Postgres or a broken Grafana shows up as a
# metric (and an alert, rules.yml group rakuten-infra) instead of as silence:
#
#   rakuten_api   the FastAPI service: HTTP layer + model/drift/training gauges
#   prometheus    Prometheus itself (rule evaluation, scrape failures, TSDB)
#   grafana       Grafana's own /metrics (alerting engine, notifications sent
#                 and failed, datasource errors). Enabled by default in Grafana.
#   postgres      PostgreSQL through postgres-exporter (pg_up, connections,
#                 database size, locks). The exporter reports pg_up=0 when it
#                 cannot reach the database, which "up" alone would not show.
#   airflow       Airflow sends StatsD metrics (AIRFLOW__METRICS__STATSD_ON) to
#                 statsd-exporter, which turns them into Prometheus metrics
#                 using statsd_mapping.yml (scheduler heartbeat, DAG run and
#                 task durations, task outcomes).
#
# Service names are those of docker-compose.yml.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "rakuten_api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "airflow"
    static_configs:
      - targets: ["statsd-exporter:9102"]
