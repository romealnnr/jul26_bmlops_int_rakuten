# Alert rules, provisioned as a file.
#
# The dashboards in this repository are already provisioned rather than
# clicked together in the UI; alerts belong in the same place and for the
# same reasons. Rules created by hand live in one person's Grafana, survive
# no rebuild, and nobody can review them in a diff.
#
# Each rule follows Grafana's three-step shape:
#   A  query the datasource
#   B  reduce the series to one number
#   C  compare that number against a threshold
# `condition: C` names the step that decides.
#
# `for:` is not decoration. It is the difference between an alert and a
# nuisance: a single bad scrape should never page anyone, and every rule
# here has to stay wrong for a while before it says so.
#
# Every query is aggregated, and the choice of aggregation is the rule. One
# API container or four behind a load balancer, each rule still evaluates a
# single series - and `min(rakuten_model_loaded)` fires when ANY replica has
# lost its model, which is the point: a fault that only affects a quarter of
# the traffic is still a fault, and an average would bury it.
#
# No contact points are defined. These rules surface in Grafana's alert
# list and on the dashboards; wiring them to email or a webhook is a
# separate decision, and one that should be made deliberately - an alert
# that triggers an action is no longer just an observation.

apiVersion: 1

groups:
  - orgId: 1
    name: rakuten-model
    folder: Rakuten
    interval: 1m
    rules:

      # ------------------------------------------------------------------
      - uid: rakuten-model-not-loaded
        title: API is serving without a model
        condition: C
        for: 2m
        annotations:
          summary: >-
            The API is up but has no model loaded, so every call to /predict
            returns 409. Check that the artifact exists and that the last
            training run finished.
        labels:
          severity: critical
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus_ds
            model:
              refId: A
              expr: min(rakuten_model_loaded)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}

      # ------------------------------------------------------------------
      - uid: rakuten-drift-above-threshold
        title: Data drift above threshold
        condition: C
        for: 10m
        annotations:
          summary: >-
            More than half of the monitored columns are above their drift
            threshold. The data reaching the model no longer looks like the
            data it was trained on; consider retraining.
        labels:
          severity: warning
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: prometheus_ds
            model:
              refId: A
              expr: max(rakuten_drift_share_of_drifted_columns)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.5]}

      # ------------------------------------------------------------------
      # The one that watches the watcher.
      #
      # If the drift job stops producing reports, the drift panel keeps
      # showing its last values and looks perfectly healthy. Nothing else in
      # this stack would notice. Silence is the most dangerous state a
      # monitoring system can be in, because it is indistinguishable from
      # good news.
      #
      # Why 72 h (259200 s): the DAG (dags/rakuten_continuous_training.py)
      # runs every 2 days (48 h, 172800 s) and computes drift at the end of
      # each run, after training (up to 1800 s) and the drift job (up to
      # 600 s). 72 h is one cycle plus 24 h of margin: a run that starts late
      # or is retried does not fire the alert, and one missed run does. With
      # 1 day, as before, this alert fired for about half of every normal
      # cycle. Change it together with the DAG schedule.
      #
      # outside_range [-1.5, 259200] fires when the age is above 72 h OR
      # equals -2 (the drift table cannot be read). It stays quiet at -1 (no
      # report has ever been produced), so a fresh install does not fire.
      - uid: rakuten-drift-monitor-stale
        title: Drift monitor has stopped reporting
        condition: C
        for: 15m
        annotations:
          summary: >-
            No drift report for more than 3 days (the DAG runs every 2 days),
            or the drift table cannot be read. The drift dashboard is showing
            stale data while appearing normal. Check the Airflow DAG
            rakuten_continuous_training and the /drift/compute endpoint.
        labels:
          severity: critical
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 3600, to: 0}
            datasourceUid: prometheus_ds
            model:
              refId: A
              expr: max(rakuten_drift_report_age_seconds)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: outside_range, params: [-1.5, 259200]}

      # ------------------------------------------------------------------
      - uid: rakuten-training-failures
        title: Training runs are failing
        condition: C
        for: 1m
        annotations:
          summary: >-
            The most recent training run failed, and no run has succeeded
            since. The model in production is not being refreshed; check the
            API logs and the Airflow task logs.
        labels:
          severity: warning
        noDataState: OK
        execErrState: Error
        # rakuten_last_training_failed is 1 from a failed run until the next
        # successful one. The previous rule counted failures over the last
        # hour only, so with a 2-day schedule a failure was visible for about
        # an hour and then resolved by itself. A down API already shows as
        # NoData on rakuten-model-not-loaded, hence noDataState OK here.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus_ds
            model:
              refId: A
              expr: max(rakuten_last_training_failed)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
