apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus_ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL
    uid: postgres_ds
    type: postgres
    access: proxy
    url: db:5432
    # The database and the credentials all come from the same variables the
    # database itself is created from, so the two cannot drift apart. A
    # literal value here works on exactly one machine: the author's, and the
    # failure elsewhere is silent - Grafana starts, the datasource appears,
    # and only the SQL panels come back empty.
    #
    # Grafana expands $VAR from its own container's environment. The three
    # variables are passed to the grafana service in docker-compose.yml.
    database: $POSTGRES_DB
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      # Grafana 11 reads the database name from jsonData; the top-level key is the older form.
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
