[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jul26-bmlops"
version = "0.1.0"
description = "Phase 1 - baseline ML pipeline + inference API"
requires-python = ">=3.12"
# Same exact pins as requirements.txt (point 25). numpy 2.5.4 needs Python >= 3.12.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "pandas==2.3.3",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "python-dotenv==1.2.4",
    "mlflow==3.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.7"]

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.data",
    "src.features",
    "src.models",
    "src.visualization",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
