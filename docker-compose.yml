services:
  db:
    image: postgres:16-alpine
    container_name: mlops_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot, runs as root before the api and ingest. Both run as uid 1000
  # (appuser), but Docker creates missing bind-mount folders as root, so on a
  # fresh clone the first training failed with "Permission denied" on
  # mlruns/models/reports. This gives those folders, data/processed (the merged
  # ingestion copy) and the torch cache volume to uid 1000, then checks that
  # uid 1000 can really write to them.
  init-perms:
    # Same image family as db (only sh, chown and su-exec are used); pinned so the
    # one-shot is reproducible.
    image: postgres:16.15-alpine
    user: "0:0"
    environment:
      APP_UID: "1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for d in models reports mlruns processed torch-cache; do
          chown -R "$$APP_UID:$$APP_UID" "/fix/$$d"
          su-exec "$$APP_UID:$$APP_UID" test -w "/fix/$$d" \
            || { echo "init-perms: uid $$APP_UID cannot write $$d"; exit 1; }
        done
        echo "init-perms: ok (uid $$APP_UID)"
    volumes:
      - ./models:/fix/models
      - ./reports:/fix/reports
      - ./mlruns:/fix/mlruns
      - ./data/processed:/fix/processed
      - torch-cache:/fix/torch-cache

  api:
    build: 
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: mlops_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./mlruns:/app/mlruns
      - ./src/data/raw:/app/src/data/raw:ro
      - torch-cache:/home/appuser/.cache/torch

  ingest:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./src/data/raw:/app/src/data/raw:ro
      # Writable copy of the merged source data (src/config.py PROCESSED_DATA_DIR).
      - ./data/processed:/app/data/processed
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
    command: ["python", "-m", "src.data.make_dataset"]


  airflow-init:
    image: apache/airflow:3.2.2
    container_name: airflow_init
    depends_on:
      db:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_ISSUER: airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    user: "${AIRFLOW_UID}:0"
    command:
      - db
      - migrate
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

  airflow-apiserver:
    image: apache/airflow:3.2.2
    container_name: airflow_apiserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    command: api-server
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

  airflow-scheduler:
    image: apache/airflow:3.2.2
    container_name: airflow_scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config

  airflow-dag-processor:
    image: apache/airflow:3.2.2
    container_name: airflow_dag_processor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - db

  streamlit:
    build: ./streamlit_app
    container_name: mlops_streamlit
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      PROMETHEUS_INTERNAL_URL: http://prometheus:9090
      GRAFANA_URL: http://localhost:3000
      PROMETHEUS_URL: http://localhost:9090
      AIRFLOW_URL: http://localhost:8081
      API_DOCS_URL: http://localhost:8000/docs
      DAGSHUB_URL: http://dagshub.com/<user>/<repo>
      RAW_DIR: /data/raw
      API_IMAGE_ROOT: /app/src/data/raw
    volumes:
      - ./src/data/raw:/data/raw:ro
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow-ui:
    build:
      context: .
      dockerfile: Dockerfile   # copy from the service at line 33
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      --host 0.0.0.0 --port 5000
      --x-frame-options NONE
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  torch-cache: